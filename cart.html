<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart</title>
  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", sans-serif; }
    body { margin:0; padding:0; background: linear-gradient(135deg,#667eea,#764ba2); min-height:100vh; }
    .container { max-width: 900px; margin: 50px auto; background:white; padding:30px; border-radius:14px; box-shadow:0 15px 35px rgba(0,0,0,0.35); }
    h2 { text-align:center; margin-bottom:30px; color:#333; }
    table { width:100%; border-collapse: collapse; margin-bottom: 30px; }
    th, td { padding:12px; text-align:center; border-bottom:1px solid #ccc; }
    th { background:#667eea; color:white; }
    td img { width:80px; height:80px; object-fit:contain; border-radius:8px; }
    .total-row td { font-weight:bold; font-size:18px; }
    .checkout-btn { display:block; width:200px; margin:0 auto; padding:12px; background:#667eea; color:white; border:none; border-radius:8px; cursor:pointer; font-size:16px; transition:0.3s; text-decoration:none; text-align:center; }
    .checkout-btn:hover { background:#5a67d8; }
    .empty-msg { text-align:center; font-size:18px; color:#555; margin:30px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Your Cart</h2>

    {% if cart %}
      <table>
        <thead>
          <tr>
            <th>Phone</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody>
          {% for item in cart %}
<tr>
  <td>{{ item.phone }}</td>
  <td>${{ item.price }}</td>
  <td>{{ item.quantity }}</td>
  <td>${{ item.total }}</td>
</tr>
{% endfor %}

<tr class="total-row">
  <td colspan="3">Grand Total</td>
  <td>${{ grand_total }}</td>
</tr>
        </tbody>
      </table>

      <form action="/checkout" method="post">
        <button class="checkout-btn" type="submit">Proceed to Checkout</button>
      </form>

    {% else %}
      <p class="empty-msg">Your cart is empty!</p>
    {% endif %}

  </div>
</body>
</html>
