<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Summary</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; margin:0; padding:0; background: linear-gradient(135deg,#667eea,#764ba2); min-height:100vh; display:flex; justify-content:center; align-items:center; }
    .box { background:white; padding:30px; border-radius:12px; box-shadow:0 15px 35px rgba(0,0,0,0.35); width:350px; text-align:center; }
    h2 { margin-bottom:20px; }
    p { font-size:16px; margin:10px 0; }
    .total { font-weight:bold; font-size:18px; margin-top:15px; }
    a { display:inline-block; margin-top:20px; padding:10px 20px; background:#667eea; color:white; text-decoration:none; border-radius:8px; transition:0.3s; }
    a:hover { background:#5a67d8; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Order Summary</h2>
    <p>Phone: {{ phone }}</p>
    <p>Price: ${{ price }}</p>
    <p>Quantity: {{ qty }}</p>
    <p class="total">Total: ${{ total }}</p>
    <a href="/cart">Go to Cart</a>
  </div>
</body>
</html>
